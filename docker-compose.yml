services:
  # ─────────────────────────────────────────────
  # PHP-FPM Application
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tugas_api_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # Anonymous volume agar vendor di container tidak tertimpa host
      - vendor_cache:/var/www/html/vendor
    env_file:
      - .env.docker
    networks:
      - tugas_api_network

  # ─────────────────────────────────────────────
  # Nginx Web Server
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tugas_api_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - tugas_api_network
    depends_on:
      - app

  # ─────────────────────────────────────────────
  # Vite Dev Server (Hot Module Replacement)
  # ─────────────────────────────────────────────
  vite:
    image: node:20-alpine
    container_name: tugas_api_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # Anonymous volume agar node_modules di container tidak tertimpa host
      - node_modules_cache:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - tugas_api_network

# ─────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────
volumes:
  vendor_cache:
  node_modules_cache:

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  tugas_api_network:
    driver: bridge
